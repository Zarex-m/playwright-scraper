[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quote-scraper"
version = "0.1.0"
description = "Playwright scraper for JS-rendered pages with retries, rate limiting and CSV/JSON export"
requires-python = ">=3.10"
authors = [{ name = "zarex" }]
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quote-scraper = "quote_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the live practice site"]
